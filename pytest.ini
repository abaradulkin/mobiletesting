[pytest]
# Pytest configuration file

# Минимальная версия pytest
minversion = 7.0

# Директория с тестами
testpaths = tests

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Маркеры для организации тестов
markers =
    smoke: Smoke tests для быстрой проверки основной функциональности
    regression: Regression tests для полного покрытия
    device_features: Тесты специфичных возможностей DeviceManager
    ios: Тесты только для iOS
    android: Тесты только для Android
    windows: Тесты только для Windows
    slow: Медленные тесты (более 1 секунды)
    critical: Критически важные тесты
    calculator: Тесты функциональности калькулятора
    addition: Тесты операции сложения
    subtraction: Тесты операции вычитания

# Опции вывода
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Логирование
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = test_execution.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Тайм-ауты для тестов (требует pytest-timeout)
# timeout = 120

# Console output style
console_output_style = progress

# Показывать локальные переменные при падении теста
# showlocals = true

